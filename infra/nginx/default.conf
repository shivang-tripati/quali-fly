upstream quali_fly_backend {
    server backend:8000;
    keepalive 16;
}

upstream quali_fly_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # FastAPI: versioned API, OpenAPI docs, and health checks.
    # `proxy_pass` without a trailing URI keeps the original request URI intact.
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://quali_fly_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Next.js handles everything else.
    location / {
        proxy_pass http://quali_fly_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Phase 10: add a :443 server block + certbot here. Not configured in Phase 0.
}
