[project]
name = "quali-fly-backend"
version = "0.1.0"
description = "Backend API for the QualiFly AI lead-nurturing platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    # Phase 7's trigger only. It is deliberately not the source of truth - see
    # `app/services/follow_up_scheduler.py`.
    "apscheduler>=3.10,<4.0",
    "cryptography>=43.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    # `Vector` and the `<=>` operator used by Phase 6 retrieval. The database
    # extension itself was created in migration 0001; this is the Python side.
    "pgvector>=0.3,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "integration: requires a live PostgreSQL instance (set TEST_DATABASE_URL)",
]
